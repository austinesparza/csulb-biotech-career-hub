name: Apply work authorization extraction fix

on:
  push:
    branches:
      - fix/work-authorization-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/work-authorization-evidence
          fetch-depth: 0
      - name: Tighten work authorization signal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ingestion/persistence/opportunity-bridge.ts')
          s = p.read_text()
          old = "const WORK_AUTHORIZATION_SIGNAL = /\\b(work authorization|authorized to work|visa sponsorship|sponsorship|citizenship|required citizen|permanent resident|cpt|opt)\\b/i;"
          new = "const WORK_AUTHORIZATION_SIGNAL = /\\b(?:work authorization|(?:legally )?authorized to work|visa sponsorship|sponsorship (?:is )?(?:available|provided|required|not available|not provided)|(?:must|need to|required to) be (?:a )?(?:u\\.?s\\.? )?citizen|u\\.?s\\.? citizens? (?:or|and) permanent residents?|permanent resident(?:s| status)?|(?:cpt|opt)(?:\\s+(?:work|employment))?\\s+(?:authorization|eligible|eligibility|status)|(?:eligible|eligibility|authorized|authorization|status).{0,40}\\b(?:cpt|opt)\\b)\\b/i;"
          if old not in s:
              raise SystemExit('expected WORK_AUTHORIZATION_SIGNAL not found')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/apply-work-authorization-fix.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten work authorization evidence matching'
          git push origin HEAD:fix/work-authorization-evidence
