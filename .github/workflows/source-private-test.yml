name: Private source validation

on:
  workflow_dispatch:
    inputs:
      source_identifier:
        description: 'Governed source identifier to validate privately'
        required: true
        default: 'fspco-op012325'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-private-test.yml'
      - 'scripts/run-private-source-test.ts'

permissions:
  contents: read

concurrency:
  group: private-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SOURCE_IDENTIFIER: ${{ github.event_name == 'workflow_dispatch' && inputs.source_identifier || 'fspco-op012325' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install from the lockfile only
        run: npm ci --ignore-scripts
      - name: Verify protected source-test configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$SOURCE_IDENTIFIER"
      - name: Run governed private source test
        run: node --conditions=react-server --import tsx scripts/run-private-source-test.ts
