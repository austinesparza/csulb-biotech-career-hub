name: Refine work authorization context

on:
  push:
    branches:
      - fix/work-authorization-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/work-authorization-evidence
          fetch-depth: 0
      - name: Refine CPT and OPT matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ingestion/persistence/opportunity-bridge.ts')
          s = p.read_text()
          start = s.index('const WORK_AUTHORIZATION_SIGNAL = ')
          end = s.index('\n', start)
          replacement = "const WORK_AUTHORIZATION_SIGNAL = /\\b(?:work authorization|(?:legally )?authorized to work|visa sponsorship|sponsorship (?:is )?(?:available|provided|required|not available|not provided)|(?:must|need to|required to) be (?:a )?(?:u\\.?s\\.? )?citizen|u\\.?s\\.? citizens? (?:or|and) permanent residents?|permanent resident(?:s| status)?|(?:cpt|opt)(?:\\s*\\/\\s*(?:cpt|opt))?(?:\\s+(?:work|employment))?\\s+(?:authorization|eligibility|status)|(?:eligible|authorized)\\s+(?:for|under|through)\\s+(?:cpt|opt)(?:\\s*\\/\\s*(?:cpt|opt))?)\\b/i;"
          p.write_text(s[:start] + replacement + s[end:])
          Path('.github/workflows/refine-work-authorization-fix.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Require real CPT and OPT authorization context'
          git push origin HEAD:fix/work-authorization-evidence
