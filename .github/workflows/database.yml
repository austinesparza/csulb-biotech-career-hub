name: Database contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.99.0
      - name: Initialize disposable local project
        run: test -f supabase/config.toml || supabase init
      - name: Apply every migration to a clean database
        run: supabase start && supabase db reset
      - name: Run SQL contract tests
        run: |
          for test_file in supabase/tests/*.sql; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
